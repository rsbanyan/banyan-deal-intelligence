name: Market data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays, after the US market close
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and macro data
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_market.py
      - name: Save data/market.json
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Update market data $(date -u +%Y-%m-%d)"
          git push
